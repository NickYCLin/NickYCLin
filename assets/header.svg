<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <title>Nick Lin — Software that connects intelligence to the real world</title>
  <desc>A midnight blue engineering landscape with a mint signal path and topographic contours. Applied AI, developer tools, and geospatial systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E31"/><stop offset="1" stop-color="#09121F"/>
    </linearGradient>
    <linearGradient id="line" x1="810" y1="300" x2="1170" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6BE"/><stop offset="1" stop-color="#96B9F5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#B9D6F6" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <path d="M840 -70C690 80 1120 55 1050 205S850 370 1060 430M885 -65C745 90 1150 75 1090 220S900 380 1100 435M930 -60C800 100 1180 95 1130 235S950 390 1140 440M975 -55C855 110 1210 115 1170 250S1000 400 1180 445M1020 -50C910 120 1240 135 1210 265S1050 410 1220 450M1065 -45C965 130 1270 155 1250 280S1100 420 1260 455" stroke="#86B4D9" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M0 359H1280" stroke="#63E6BE" stroke-opacity=".4" stroke-width="2"/>
    <rect x="56" y="48" width="28" height="3" rx="1.5" fill="#63E6BE"/>
    <text x="98" y="56" fill="#A7B9CF" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3">NICK LIN / ENGINEER &amp; BUILDER</text>
    <text x="54" y="131" fill="#F0F5FC" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Software that connects</text>
    <text x="54" y="192" fill="#F0F5FC" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">intelligence to the</text>
    <text x="54" y="253" fill="#63E6BE" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">real world.</text>
    <text x="56" y="313" fill="#A7B9CF" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1">APPLIED AI  /  DEVELOPER TOOLS  /  GEOSPATIAL SYSTEMS</text>
    <g stroke="url(#line)" stroke-width="2">
      <path d="M870 258H942L995 205V140L1048 87H1158"/>
      <path d="M942 258L996 312H1158" stroke-opacity=".35"/>
      <path d="M995 205H1124" stroke-opacity=".55"/>
    </g>
    <g fill="#101E31" stroke="#63E6BE" stroke-width="2">
      <circle cx="870" cy="258" r="7"/><circle cx="995" cy="205" r="7"/><circle cx="1158" cy="87" r="7"/>
    </g>
    <circle cx="995" cy="205" r="21" stroke="#63E6BE" stroke-opacity=".18"/>
    <circle cx="1124" cy="205" r="4" fill="#96B9F5"/>
    <circle cx="1158" cy="312" r="4" fill="#96B9F5"/>
    <text x="1071" y="67" fill="#A7B9CF" font-family="Consolas,monospace" font-size="12" letter-spacing="2">INTELLIGENCE</text>
    <text x="824" y="294" fill="#A7B9CF" font-family="Consolas,monospace" font-size="12" letter-spacing="2">REAL WORLD</text>
  </g>
